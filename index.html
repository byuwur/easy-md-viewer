<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>easy MD viewer</title>
  <link href="md.css" rel="stylesheet" />
  <script src="md.js" defer></script>
</head>

<body>
  <link id="byVIEWtheme" href="https://byuwur.github.io/easy-md-viewer/md.light.css" rel="stylesheet" />
  <style>
    body {
      background: #222;
      color: #eee;
    }

    a {
      color: #56f;
    }

    a.listed-link {
      display: inline-block;
      width: 20rem;
    }
  </style>
  <p>easy MD viewer</p>
  <p>This is a demo of <a href="https://github.com/byuwur/easy-md-viewer">https://github.com/byuwur/easy-md-viewer</a></p>
  <a href="javascript:document.querySelector('#byVIEWtheme').setAttribute('href','https://byuwur.github.io/easy-md-viewer/md.light.css');">Light/Claro</a> |
  <a href="javascript:document.querySelector('#byVIEWtheme').setAttribute('href','https://byuwur.github.io/easy-md-viewer/md.dark.css');">Dark/Oscuro</a>
  <br /><br />
  <a class="listed-link" href="javascript:render();">DEMO MARKDOWN</a>
  <a class="listed-link" href="javascript:benchmark();">BENCHMARK MARKDOWN</a>
  <br /><br />
  <div id="byMDrenderer"></div>
  <script>
    const demoMD = `
# easy MD viewer

A **lightweight**, dependency-free Markdown viewer that renders directly to the DOM.

## Inline syntax

Text can be *italic*, **bold**, ***both***, ~~struck out~~, or contain \`inline code\`.

Links work too: [easy JSON viewer](https://github.com/byuwur/easy-json-viewer).

> ### Blockquotes
>
> Blockquotes recursively support **Markdown**.
>
> - [x] Nested task
> - [ ] Another task

## Lists

1. Ordered item
2. Another item

- Unordered item
  - Nested unordered item
  - Another nested item

5. Ordered lists can start at another number
6. And continue

## Table

| Feature | Support | Alignment |
| :--- | :---: | ---: |
| Tables | **Yes** | Right |
| Escaped pipes | A \\| B | \`x|y\` |

## Code

\`\`\`js
byMDviewer(
  document.getElementById("byMDrenderer"),
  "# Hello **world**"
);
\`\`\`

Raw HTML is intentionally not executed:

\`<script>alert("nope")<\/script>\`

---

No npm. No CDN. No dependencies.
    `;
    const renderEl = document.getElementById("byMDrenderer");
    const render = () => byMDviewer(renderEl, demoMD);
    const renderFetched = (url, options = {}) => {
      fetch(url)
        .then((response) => {
          if (!response.ok) console.warn(`Something went wrong`, response.statusText);
          return response.text();
        })
        .then((response) => {
          console.log(response);
          byMDviewer(renderEl, response, options);
        })
        .catch((e) => {
          console.warn(`Something went wrong`, e);
        });
    };
    const benchmark = () => renderFetched(`https://raw.githubusercontent.com/byuwur/easy-md-viewer/main/test.md`);
    document.addEventListener("DOMContentLoaded", () => {
      render();
    });
  </script>
</body>

</html>
