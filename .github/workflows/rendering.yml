name: Rendering checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rendering:
    name: ${{ matrix.suite }} (${{ matrix.browser }})
    strategy:
      # Report every engine/suite result even if another combination fails.
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        suite: [rendering, playground]
    runs-on: ubuntu-24.04
    container:
      # Keep the image and npm package on the same Playwright version.
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    env:
      BROWSER_ENGINE: ${{ matrix.browser }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: easy-md-viewer
      - uses: actions/checkout@v4
        with:
          repository: byuwur/easy-code-viewer
          ref: v1.7
          path: easy-code-viewer
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser test tools
        run: npm install --prefix "$RUNNER_TEMP/viewer-tests" --no-package-lock --no-audit --no-fund playwright@1.63.0
      - name: Check source and ${{ matrix.suite }} tests
        working-directory: easy-md-viewer
        env:
          NODE_PATH: ${{ runner.temp }}/viewer-tests/node_modules
        run: |
          node --check md.js
          node --test tests/${{ matrix.suite }}.cjs
